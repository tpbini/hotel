name: Deploy to Live Server

on:
  push:
    branches:
      - main
    paths:
      - 'Web/wp-content/themes/astra-child/**'
      - 'Web/wp-content/plugins/restaurant-booking/**'
      - 'Web/wp-content/plugins/restaurant-qr-pos/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Theme to Live Hostinger Server via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          protocol: sftp
          local-dir: ./Web/wp-content/themes/astra-child/
          server-dir: /domains/thecochin.co.uk/public_html/wp-content/themes/astra-child/
          dangerous-clean-slate: false

      - name: Deploy Restaurant Booking Plugin to Live Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          protocol: sftp
          local-dir: ./Web/wp-content/plugins/restaurant-booking/
          server-dir: /domains/thecochin.co.uk/public_html/wp-content/plugins/restaurant-booking/
          dangerous-clean-slate: false

      - name: Deploy Restaurant QR POS Plugin to Live Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          protocol: sftp
          local-dir: ./Web/wp-content/plugins/restaurant-qr-pos/
          server-dir: /domains/thecochin.co.uk/public_html/wp-content/plugins/restaurant-qr-pos/
          dangerous-clean-slate: false
