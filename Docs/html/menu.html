<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#741f2b">
  <title>The Cochin — Responsive Header</title>
  <style>
    :root {
      --brand: #741f2b;
      --brand-dark: #5e1721;
      --cream: #fff8ed;
      --gold: #c9a24d;
      --header-height: 132px;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: #2b2523; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body.menu-open { overflow: hidden; }
    a { color: inherit; }
    button { font: inherit; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      min-height: var(--header-height);
      background: var(--brand);
      color: var(--cream);
      box-shadow: 0 1px 0 rgba(255,255,255,.12);
      transition: min-height .25s var(--ease), box-shadow .25s ease;
    }
    .site-header.is-scrolled { min-height: 92px; box-shadow: 0 12px 32px rgba(43, 18, 22, .2); }

    .header-inner {
      width: min(100% - 48px, 1480px);
      min-height: inherit;
      margin-inline: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 44px;
    }

    .brand { display: inline-flex; align-items: center; flex: 0 0 auto; text-decoration: none; }
    .brand img { display: block; width: clamp(250px, 21vw, 360px); height: auto; }

    .nav-wrap { display: flex; align-items: center; gap: clamp(26px, 2.8vw, 52px); }
    .nav-list { display: flex; align-items: center; gap: clamp(22px, 2.4vw, 44px); padding: 0; margin: 0; list-style: none; }
    .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 48px;
      padding: 6px 1px;
      color: rgba(255,248,237,.9);
      font-size: 1rem;
      font-weight: 500;
      text-decoration: none;
      transition: color .2s ease;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      right: 100%;
      bottom: 5px;
      height: 2px;
      background: var(--gold);
      transition: right .3s var(--ease);
    }
    .nav-link:hover, .nav-link:focus-visible, .nav-link[aria-current="page"] { color: #fff; }
    .nav-link:hover::after, .nav-link:focus-visible::after, .nav-link[aria-current="page"]::after { right: 0; }

    .book-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 10px 24px;
      border: 2px solid rgba(255,248,237,.88);
      border-radius: 999px;
      color: var(--cream);
      font-size: .95rem;
      font-weight: 650;
      letter-spacing: .035em;
      text-decoration: none;
      white-space: nowrap;
      transition: color .25s ease, background .25s ease, border-color .25s ease, transform .25s var(--ease);
    }
    .book-button:hover, .book-button:focus-visible { color: var(--brand); background: var(--cream); border-color: var(--cream); transform: translateY(-2px); }

    .menu-toggle {
      display: none;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid rgba(255,255,255,.42);
      border-radius: 50%;
      background: transparent;
      color: var(--cream);
      cursor: pointer;
    }
    .menu-toggle span, .menu-toggle::before, .menu-toggle::after {
      content: "";
      display: block;
      width: 20px;
      height: 2px;
      margin: 5px auto;
      border-radius: 2px;
      background: currentColor;
      transition: transform .28s var(--ease), opacity .18s ease;
    }
    .menu-toggle[aria-expanded="true"] span { opacity: 0; }
    .menu-toggle[aria-expanded="true"]::before { transform: translateY(7px) rotate(45deg); }
    .menu-toggle[aria-expanded="true"]::after { transform: translateY(-7px) rotate(-45deg); }

    :focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }
    .demo-content { min-height: 110vh; padding: 72px 24px; background: #f5efe3; text-align: center; }
    .demo-content p { max-width: 620px; margin: 0 auto; line-height: 1.7; }

    @media (max-width: 980px) {
      :root { --header-height: 92px; }
      .header-inner { width: min(100% - 32px, 1480px); gap: 16px; }
      .brand img { width: clamp(220px, 42vw, 310px); }
      .menu-toggle { display: block; position: relative; z-index: 2; flex: 0 0 auto; }
      .nav-wrap {
        position: fixed;
        inset: var(--header-height) 0 0;
        display: grid;
        align-content: start;
        gap: 28px;
        padding: 30px 24px max(30px, env(safe-area-inset-bottom));
        background: linear-gradient(145deg, var(--brand) 0%, var(--brand-dark) 100%);
        overflow-y: auto;
        visibility: hidden;
        opacity: 0;
        transform: translateY(-12px);
        pointer-events: none;
        transition: opacity .25s ease, transform .35s var(--ease), visibility .35s;
      }
      .nav-wrap.is-open { visibility: visible; opacity: 1; transform: translateY(0); pointer-events: auto; }
      .nav-list { display: grid; align-items: stretch; gap: 0; }
      .nav-link { min-height: 58px; border-bottom: 1px solid rgba(255,255,255,.14); font-family: Georgia, serif; font-size: clamp(1.25rem, 5vw, 1.65rem); }
      .nav-link::after { display: none; }
      .book-button { width: 100%; min-height: 56px; }
      .site-header.is-scrolled { min-height: var(--header-height); }
    }

    @media (max-width: 480px) {
      .header-inner { width: min(100% - 24px, 1480px); }
      .brand img { width: min(69vw, 255px); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#home" aria-label="The Cochin — Home">
        <img src="assets/the-cochin-logo.png" alt="The Cochin">
      </a>

      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primaryNavigation" aria-label="Open menu">
        <span></span>
      </button>

      <nav class="nav-wrap" id="primaryNavigation" aria-label="Primary navigation">
        <ul class="nav-list">
          <li><a class="nav-link" href="#home" aria-current="page">Home</a></li>
          <li><a class="nav-link" href="#menu">Menu</a></li>
          <li><a class="nav-link" href="#about">About</a></li>
          <li><a class="nav-link" href="#banquets">Banquets</a></li>
          <li><a class="nav-link" href="#contact">Contact</a></li>
        </ul>
        <a class="book-button" href="#booking">Book a table</a>
      </nav>
    </div>
  </header>

  <main class="demo-content" id="home">
    <p>This sample area is included only to demonstrate the sticky header. Replace it with your page content and update each navigation link with your website URLs.</p>
  </main>

  <script>
    const header = document.querySelector('#siteHeader');
    const toggle = document.querySelector('.menu-toggle');
    const navigation = document.querySelector('#primaryNavigation');
    const mobileQuery = window.matchMedia('(max-width: 980px)');

    function closeMenu() {
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open menu');
      navigation.classList.remove('is-open');
      document.body.classList.remove('menu-open');
    }

    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!open));
      toggle.setAttribute('aria-label', open ? 'Open menu' : 'Close menu');
      navigation.classList.toggle('is-open', !open);
      document.body.classList.toggle('menu-open', !open);
    });

    navigation.addEventListener('click', event => {
      if (event.target.closest('a') && mobileQuery.matches) closeMenu();
    });

    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') { closeMenu(); toggle.focus(); }
    });

    mobileQuery.addEventListener('change', event => { if (!event.matches) closeMenu(); });
    window.addEventListener('scroll', () => header.classList.toggle('is-scrolled', window.scrollY > 24), { passive: true });
  </script>
</body>
</html>
